name: build

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  perl:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        perl-version:
          - '5.8-buster'
          - '5.10-buster'
          - '5.18-buster'
          - '5.20-buster'
          - '5.26'
          - 'stable'
          - 'stable-threaded'

    container:
      image: perl:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v7
      - name: perl -V
        run: perl -V
      - name: Install dependencies for old perls
        if: ${{ matrix.perl-version == '5.8-buster' || matrix.perl-version == '5.10-buster' }}
        run: curl -sL https://cpanmin.us | perl - Test::More@0.96 DBI@1.651
      - name: Install dependencies
        run: curl -sL https://cpanmin.us | perl - --installdeps .
      - name: Run tests
        run: perl Makefile.PL && make && make test
      - name: Run tests (asan)
        if: ${{ matrix.perl-version == 'stable' || matrix.perl-version == 'stable-threaded' }}
        run: TEST_DBD_SQLITE_WITH_ASAN=1 make clean && perl Makefile.PL && make && make test
